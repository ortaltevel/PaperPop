<!doctype html><html dir="rtl" lang="he"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>אישור תשלום · PaperPop</title><link rel="stylesheet" href="/styles.css?v=43"></head><body><main class="pp-payment pp-container"><img src="/assets/logo-wordmark.svg" alt="PaperPop" width="150"><h1 id="resultTitle">מאמתים את התשלום</h1><p id="resultMessage" role="status" aria-live="polite">נא להמתין רגע, אנחנו מוודאים שהתשלום אושר.</p><a class="pp-btn" href="/" id="homeLink" hidden>חזרה לאתר</a></main><script src="/commerce.js?v=43"></script><script>(function(){var q=new URLSearchParams(location.search),mock=q.get('mock')==='1',id=q.get('order'),title=document.getElementById('resultTitle'),message=document.getElementById('resultMessage'),home=document.getElementById('homeLink');function paid(){title.textContent='תודה! ההזמנה התקבלה';message.textContent='התשלום אושר וההזמנה התקבלה. הקבלה תישלח לכתובת המייל שהזנת.';home.hidden=false;if(window.PaperPopCart)window.PaperPopCart.clear()}function pending(){title.textContent='התשלום בבדיקה';message.textContent='עדיין לא התקבל אישור סופי. אין צורך לשלם שוב. נעדכן אותך לאחר קבלת האישור.';home.hidden=false}if(mock){paid();return}if(!/^[0-9a-f-]{36}$/i.test(id||'')){location.replace('/checkout?payment=failed');return}var tries=0;function check(){fetch('/api/order-status?order='+encodeURIComponent(id),{headers:{accept:'application/json'}}).then(function(r){return r.ok?r.json():Promise.reject()}).then(function(data){if(data.status==='paid'){paid();return}if(++tries<10){setTimeout(check,1500);return}pending()}).catch(function(){if(++tries<4){setTimeout(check,1500);return}pending()})}check()})();</script></body></html>
