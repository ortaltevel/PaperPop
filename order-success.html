<!doctype html>
<html dir="rtl" lang="he">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>אישור הזמנה · PaperPop</title>
  <link rel="stylesheet" href="/styles.css?v=46">
</head>
<body>
  <main class="pp-payment pp-payment-result pp-container">
    <div id="resultIcon" class="pp-result-icon" aria-hidden="true">✓</div>
    <h1 id="resultTitle">מאמתים את התשלום</h1>
    <p id="resultMessage" role="status" aria-live="polite">נשארים בעמוד — הוא יתעדכן אוטומטית ברגע שנקבל אישור מ־SUMIT.</p>
    <p id="orderReference" class="pp-order-reference" hidden>
      מספר הזמנה: <strong id="orderNumber"></strong>
    </p>
    <div id="resultProgress" class="pp-result-progress">
      <span class="pp-indeterminate" role="progressbar" aria-label="אימות התשלום"><i></i></span>
      <small>בדרך כלל זה לוקח מספר שניות</small>
    </div>
    <a class="pp-btn" href="/" id="homeLink" hidden>חזרה לחנות</a>
  </main>
  <script src="/commerce.js?v=44"></script>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var mock = q.get("mock") === "1";
      var id = q.get("order");
      var title = document.getElementById("resultTitle");
      var message = document.getElementById("resultMessage");
      var home = document.getElementById("homeLink");
      var progress = document.getElementById("resultProgress");
      var icon = document.getElementById("resultIcon");
      var reference = document.getElementById("orderReference");
      var orderNumber = document.getElementById("orderNumber");

      function showReference(value) {
        if (!value) return;
        orderNumber.textContent = value;
        reference.hidden = false;
      }

      function paid(number) {
        icon.classList.add("is-paid");
        title.textContent = "תודה! ההזמנה התקבלה";
        message.textContent = "התשלום אושר וההזמנה נשמרה.";
        showReference(number);
        progress.hidden = true;
        home.hidden = false;
        if (window.PaperPopCart) window.PaperPopCart.clear();
      }

      function delayed() {
        title.textContent = "האישור מתעכב מעט";
        message.textContent = "אין צורך לשלם שוב. אפשר להשאיר את העמוד פתוח ונמשיך לבדוק אוטומטית, או לחזור לחנות ולפנות אלינו אם האישור לא יופיע בתוך כמה דקות.";
        home.hidden = false;
      }

      if (mock) {
        paid("PP-DEMO");
        return;
      }
      if (!/^[0-9a-f-]{36}$/i.test(id || "")) {
        window.top.location.replace("/checkout?payment=failed");
        return;
      }

      var tries = 0;
      var delayedShown = false;
      function check() {
        fetch("/api/order-status?order=" + encodeURIComponent(id), {
          headers: { accept: "application/json" },
          cache: "no-store"
        }).then(function (response) {
          return response.ok ? response.json() : Promise.reject();
        }).then(function (data) {
          if (data.status === "paid") {
            paid(data.orderNumber);
            return;
          }
          tries++;
          if (tries >= 15 && !delayedShown) {
            delayedShown = true;
            delayed();
          }
          setTimeout(check, 2000);
        }).catch(function () {
          tries++;
          if (tries >= 5 && !delayedShown) {
            delayedShown = true;
            delayed();
          }
          setTimeout(check, 3000);
        });
      }
      check();
    })();
  </script>
</body>
</html>
