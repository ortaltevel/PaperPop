<!doctype html><html dir="rtl" lang="he"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>פרטי הזמנה · PaperPop</title><link rel="icon" href="/assets/logo.svg"><link rel="stylesheet" href="/styles.css?v=43"></head><body>
<a class="pp-skip" href="#main">דילוג לתוכן</a><header class="pp-header"><div class="pp-header__ticker">משלוח חינם בהזמנה מעל <bdi dir="ltr">₪250</bdi></div><div class="pp-header__bar"><a class="pp-logo pp-logo--md" href="/"><img src="/assets/logo-wordmark.svg" alt="PaperPop" width="115" height="44"></a></div></header>
<main id="main" class="pp-checkout pp-container"><div><h1>פרטי ההזמנה</h1><form id="checkoutForm" novalidate>
<fieldset><legend>איך תרצו לקבל את ההזמנה?</legend><label class="pp-choice"><input type="radio" name="shipping" value="registered" required><span><strong>דואר רשום</strong><small data-registered-price>17 ₪</small></span></label><label class="pp-choice"><input type="radio" name="shipping" value="pickup"><span><strong>איסוף עצמי מרעננה</strong><small>חינם · בתיאום מראש. הכתובת המלאה תישלח כשההזמנה תהיה מוכנה.</small></span></label><label class="pp-choice"><input type="radio" name="shipping" value="courier"><span><strong>שליח עד הבית</strong><small>69 ₪</small></span></label></fieldset>
<fieldset><legend>פרטי המזמין</legend><div class="pp-form-grid"><label>שם מלא<input name="fullName" autocomplete="name" maxlength="100" required></label><label>טלפון<input name="phone" type="tel" autocomplete="tel" inputmode="tel" maxlength="20" required></label><label class="pp-form-wide">אימייל<input name="email" type="email" autocomplete="email" maxlength="254" required></label></div></fieldset>
<fieldset data-address-fields hidden><legend>כתובת למשלוח</legend><div class="pp-form-grid"><label>עיר או יישוב<input name="city" autocomplete="address-level2" maxlength="80" data-address-required></label><label>רחוב<input name="street" autocomplete="address-line1" maxlength="100" data-address-required></label><label>מספר בית<input name="houseNumber" maxlength="10" data-address-required></label><label>דירה <span>(רשות)</span><input name="apartment" maxlength="10"></label><label>מיקוד<input name="postalCode" autocomplete="postal-code" inputmode="numeric" maxlength="10" data-address-required></label><label class="pp-form-wide">הערות למשלוח <span>(רשות)</span><textarea name="notes" maxlength="500"></textarea></label></div></fieldset>
<p class="pp-form-note">בלחיצה על מעבר לתשלום אני מאשר/ת את תנאי הרכישה ומדיניות הפרטיות.</p><button class="pp-btn pp-btn--lg" type="submit">מעבר לתשלום מאובטח</button><p id="checkoutStatus" role="status" aria-live="polite"></p></form></div>
<aside class="pp-order-summary" aria-labelledby="summaryTitle"><h2 id="summaryTitle">סיכום הזמנה</h2><ul data-checkout-items></ul><dl><div><dt>מוצרים</dt><dd data-checkout-subtotal></dd></div><div><dt>משלוח</dt><dd data-checkout-shipping></dd></div><div class="pp-order-total"><dt>סה״כ</dt><dd data-checkout-total></dd></div></dl></aside></main><script defer src="/commerce.js?v=43"></script></body></html>
